[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pap-verifier"
version = "0.1.0"
description = "Independent PAP v0.1 verifier"
requires-python = ">=3.13"
dependencies = ["cryptography==43.0.0", "jsonschema==4.19.2"]

[project.scripts]
pap = "pap_verifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]